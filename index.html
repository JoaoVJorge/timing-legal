<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timing — documentos legais</title>
<meta name="description" content="Política de Privacidade e exclusão de conta do aplicativo Timing.">
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #16181d;
  --muted: #5b6372;
  --rule: #e3e6ec;
  --accent: #3f5bd9;
  --card: #f7f8fa;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a;
    --fg: #e8eaee;
    --muted: #9aa2b1;
    --rule: #2a2e36;
    --accent: #8ea2ff;
    --card: #1c1f25;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 48px 16px 96px;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

main { max-width: 42rem; margin: 0 auto; }

header { border-bottom: 1px solid var(--rule); padding-bottom: 24px; margin-bottom: 8px; }

h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 8px; }
h2 { font-size: 1.25rem; margin: 40px 0 8px; }
h3 { font-size: 1rem; margin: 28px 0 4px; }

.app { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.effective { color: var(--muted); font-size: 0.9rem; margin: 0; }

.lang {
  display: flex;
  gap: 8px;
  margin: 24px 0 0;
  padding: 0;
  list-style: none;
  font-size: 0.9rem;
}

.lang a {
  display: inline-block;
  padding: 6px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--card);
  color: var(--fg);
  text-decoration: none;
}

a { color: var(--accent); }

.section { border-top: 1px solid var(--rule); margin-top: 56px; padding-top: 8px; }

ul, ol { padding-left: 1.25rem; }
li { margin: 6px 0; }

code {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.9em;
}

footer {
  margin-top: 64px;
  padding-top: 24px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  font-size: 0.9rem;
}
</style>
</head>
<body>
<main>
<header>
  <p class="app">Timing</p>
  <h1>Documentos do aplicativo</h1>
  <p class="effective">Privacidade e exclusão de conta / Privacy and account deletion</p>
</header>

<ul>
  <li><a href="privacy-policy.html">Política de Privacidade / Privacy Policy</a></li>
  <li><a href="delete-account.html">Excluir sua conta / Delete your account</a></li>
</ul>

<footer>
  <p>Contato / Contact: <a href="mailto:joaovictorjorgealmeidabenevide@gmail.com">joaovictorjorgealmeidabenevide@gmail.com</a></p>
</footer>
</main>
</body>
</html>
